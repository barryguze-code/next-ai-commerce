<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tenant setup | Next AI Commerce</title><link rel="stylesheet" href="/css/app.css" th:href="@{/css/app.css(v=${buildVersion})}"><link rel="stylesheet" href="/css/brand.css" th:href="@{/css/brand.css(v=${buildVersion})}"><link rel="stylesheet" href="/css/platform-ui.css?v=20261002-5" th:href="@{/css/platform-ui.css(v=${buildVersion})}"><script defer src="/js/platform-ui.js?v=1.6.6" th:src="@{/js/platform-ui.js(v=${buildVersion})}"></script><th:block th:replace="~{fragments/collaboration-runtime :: head}"></th:block></head><body class="app-page"><aside class="sidebar"><div th:replace="~{fragments/sidebar-nav :: nav('accounts')}"></div><div th:replace="~{fragments/sidebar-user :: user}"></div></aside><main class="workspace"><header class="workspace-header"><div><h1>Tenant setup</h1><p class="page-intro">Choose the tenant manager and the accounts they manage.</p></div><a href="/app/collaboration/board" class="secondary-button">Back to tasks</a></header><p th:if="${error}" th:text="${error}" class="notice error"></p><form class="data-card" method="post" th:action="@{/app/platform/parent-tenants}"><div class="dialog-body"><label>Tenant name<input name="name" maxlength="160" required></label><label>Tenant manager<select name="manager" required><option value="">Choose a person</option><option th:each="p:${people}" th:value="${p.id}" th:text="${p.name+' · '+p.email}"></option></select></label><label>Manager role<select name="managerRole"><option value="OWNER">Owner</option><option value="ADMIN">Administrator</option></select></label><fieldset><legend>Accounts to include</legend><label th:each="a:${accounts}"><input type="checkbox" name="accounts" th:value="${a.id}"><span th:text="${a.name}"></span></label></fieldset><fieldset><legend>Other home tenant members</legend><label th:each="p:${people}"><input type="checkbox" name="people" th:value="${p.id}"><span th:text="${p.name+' · '+p.email}"></span></label></fieldset><p>The manager can administer all selected accounts and stores. Other members need separate account access. Each person has one home tenant.</p></div><footer class="dialog-actions"><button type="submit" class="primary-button">Create tenant</button></footer></form></main><th:block th:replace="~{fragments/collaboration-runtime :: body}"></th:block></body></html>
