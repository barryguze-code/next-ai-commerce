<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Collaborate | Next AI Commerce</title>
<link rel="stylesheet" href="/css/app.css"><link rel="stylesheet" href="/css/brand.css"><link rel="stylesheet" href="/css/platform-ui.css?v=20261002-5"><script defer src="/js/platform-ui.js?v=1.6.6"></script><link rel="stylesheet" href="/css/collaboration-board.css?v=1.11.5">
<th:block th:replace="~{fragments/collaboration-runtime :: head}"></th:block>
<script defer src="/js/table-preferences.js"></script><script defer src="/js/platform-icons.js"></script><script defer src="/js/table-widget.js?v=1.11.0"></script><script defer src="/js/collaboration-board-state.js"></script><script defer src="/js/confirm-dialog.js"></script><link rel="stylesheet" href="/css/confirm-dialog.css"><script defer src="/js/personal-collaboration.js?v=1.11.7"></script>
<link rel="stylesheet" href="/css/table-widget.css?v=1.9.0"><link rel="stylesheet" href="/css/collaboration.css?v=20261001-5"><link rel="stylesheet" href="/css/standard-record-tables.css?v=1.9.1"><link rel="stylesheet" href="/css/collaboration-refinement.css?v=20261031-compact"></head><body class="app-page platform-standard-tables"><aside class="sidebar"><a class="brand brand-lockup" href="/app"><img src="/images/next-ai-mark-transparent.png" alt=""><span class="brand-wordmark"><strong>Next<b>AI</b></strong><small>COMMERCE</small></span></a><div th:replace="~{fragments/sidebar-nav :: nav('collaboration')}"></div><div th:replace="~{fragments/sidebar-user :: user}"></div></aside>

<main class="workspace collaboration-workspace" id="personal-queue" th:attr="data-user=${personalUser},data-workspace-account=${selectedAccountId},data-workspace-store=${selectedStoreId}">
<header class="workspace-header"><div><h1>Collaborate</h1></div><div class="header-actions"><div th:replace="~{fragments/context-switcher :: collaborationFilter}"></div></div></header>
<section class="data-card"><header class="card-toolbar"><h2>Team conversations &amp; tasks</h2><button th:if="${canEditCatalog}" type="button" data-new-task class="primary-button task-create-button" aria-haspopup="dialog"><img src="/images/platform/table/collaboration-create-lightning.png" alt="">Create task</button><nav class="collaboration-view-tabs" aria-label="Conversation view"><a href="#active" data-personal-scope="ACTIVE">Active</a><a class="active" aria-current="page" href="#me" data-personal-scope="ASSIGNED">@Me</a><a href="#private" data-personal-scope="PRIVATE">🔒 My private notes</a><a href="#closed" data-personal-scope="CLOSED">Closed</a></nav>
</header>
<div class="table-standard-toolbar table-widget-tools">
<label class="table-standard-search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg><input id="personal-search" type="search" aria-label="Search conversations" placeholder="Search conversations"></label>
<div class="table-widget-tools"><details class="table-filter-control"><summary class="secondary-button compact-button">Filters</summary><div class="table-filter-panel"><label>Record type<select id="personal-type"><option value="">All record types</option><option value="PLATFORM">General team</option><option value="INVENTORY">Inventory</option><option value="SHIPMENT">Shipments</option><option value="CATALOG">Catalogue</option><option value="ORDER">Orders</option><option value="LABEL">Shipping labels</option></select></label></div></details>
<div data-column-control="personal-collaboration"></div><button type="button" class="secondary-button compact-button" id="personal-download" aria-label="Download CSV"><svg viewBox="0 0 24 24" aria-hidden="true" width="20" height="20"><path d="M12 3v12m-5-5 5 5 5-5M4 15v6h16v-6" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
</div></div>
<div class="personal-result-controls"><p role="status" id="personal-status">Loading your assignments…</p><label class="personal-initial-count" title="Saved for your user on this browser">Show first <input id="personal-size" type="number" min="1" max="50" value="5" aria-label="Show first tasks"> tasks <small id="personal-size-saved" role="status"></small></label></div>
<div class="personal-table-groups" id="personal-columns"></div></section>
<form hidden method="post" id="personal-form" th:action="@{/app/collaboration/personal/position}"></form>
</main><div th:replace="~{fragments/collaboration-runtime :: body}"></div><div th:replace="~{fragments/collaboration-assignment :: choices}"></div><script defer src="/js/collaboration-assignment.js?v=25"></script></body></html>
