<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Action suggestions | Next AI Commerce</title><link rel="stylesheet" href="/css/app.css"><link rel="stylesheet" href="/css/brand.css"><link rel="stylesheet" href="/css/access.css"><link rel="stylesheet" href="/css/platform-ui.css?v=20261002-5"><script defer src="/js/platform-ui.js?v=20261002-5"></script></head>
<body class="app-page"><aside class="sidebar"><a class="brand" href="/app">Next AI Commerce</a><div th:replace="~{fragments/sidebar-nav :: nav('action-suggestions')}"></div><div th:replace="~{fragments/sidebar-user :: user}"></div></aside>
<main class="workspace"><header class="workspace-header"><div><span class="eyebrow dark">Platform administration · R&amp;D</span><h1>Action suggestions</h1><p>Latest 500 suggestions across accounts. Review, plan, and track improvements for everyone.</p></div></header>
<p th:if="${#lists.isEmpty(suggestions)}">No suggestions yet.</p>
<article class="data-card suggestion-review" th:each="suggestion:${suggestions}"><h2 th:text="${suggestion.title}">Suggested action</h2><small th:text="${suggestion.submitted_by+' · '+suggestion.created_at+' · Account '+suggestion.tenant_id}"></small><p th:text="${suggestion.explanation}"></p><p><strong th:text="${suggestion.menu_context}"></strong><small th:text="${' · '+suggestion.page_path}"></small></p>
<form method="post" th:action="@{/app/platform/action-suggestions/{id}(id=${suggestion.id})}"><label>Review status <select name="status"><option th:each="status:${ {'NEW','UNDER_REVIEW','PLANNED','DEPLOYED','DECLINED'} }" th:value="${status}" th:text="${#strings.replace(status,'_',' ')}" th:selected="${status == suggestion.status}"></option></select></label><textarea name="reviewNote" maxlength="2000" rows="2" aria-label="R&amp;D review note" placeholder="Review notes, delivery reference, or reason" th:text="${suggestion.review_note}"></textarea><button class="primary-button" type="submit">Save review</button></form>
<small th:if="${suggestion['reviewed_by'] != null}" th:text="${'Last reviewed by '+suggestion.reviewed_by+' · '+suggestion.updated_at}"></small></article></main></body></html>
