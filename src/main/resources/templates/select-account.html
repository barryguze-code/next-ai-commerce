<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Choose account | Next AI Commerce</title><link rel="icon" type="image/png" href="/images/next-ai-mark-transparent.png"><link rel="stylesheet" href="/css/app.css"><link rel="stylesheet" href="/css/brand.css"></head>
<body class="auth-page"><main class="auth-shell"><section class="brand-panel"><a class="brand brand-lockup" href="/app/select-account"><img src="/images/next-ai-mark-transparent.png" alt=""><span class="brand-wordmark"><strong><span>Next</span><b>AI</b></strong><small>COMMERCE</small></span></a><div class="brand-message"><span class="eyebrow">Account access</span><h1>Which business are you working on?</h1><p>Orders, users, and marketplace data remain securely separated by account.</p></div><p class="brand-foot">You can switch accounts later from the workspace.</p></section><section class="form-panel"><div class="login-card"><div><span class="eyebrow dark" th:text="${roleLabel}">Super Admin</span><h2 th:text="${#lists.isEmpty(accounts) ? 'Create your first account' : 'Choose an account'}">Choose an account</h2><p class="muted" th:text="${#lists.isEmpty(accounts) ? 'Add a business workspace to begin.' : 'Only accounts available to your login are shown.'}">Only accounts available to your login are shown.</p></div><a class="primary-button first-account-action" th:if="${isSuperAdmin and #lists.isEmpty(accounts)}" href="/app/platform/accounts?create=true">Create first account <span>→</span></a><form th:each="account : ${accounts}" th:action="@{/app/select-account}" method="post" class="account-choice"><input type="hidden" name="tenantId" th:value="${account.id}"><input type="hidden" name="tenantName" th:value="${account.name}"><button type="submit" class="account-choice-button"><span class="avatar" th:text="${#strings.substring(account.name,0,1)}">I</span><span><strong th:text="${account.name}">Business account</strong><small th:text="${account.connections + ' marketplace connection(s)'}">1 connection</small></span><b>→</b></button></form><form method="post" th:action="@{/logout}"><button class="secondary-button" type="submit">Sign out</button></form></div></section></main></body></html>
