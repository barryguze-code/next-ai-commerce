<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workspace | Next AI Commerce</title><link rel="icon" type="image/png" href="/images/next-ai-mark-transparent.png"><link rel="stylesheet" href="/css/app.css"><link rel="stylesheet" href="/css/brand.css?v=20260909-1"><link rel="stylesheet" href="/css/access.css"><th:block th:replace="~{fragments/collaboration-runtime :: head}"></th:block></head>
<body class="app-page">
  <aside class="sidebar"><a class="brand brand-lockup" href="/app" aria-label="Next AI Commerce"><img src="/images/next-ai-mark-transparent.png" alt=""><span class="brand-wordmark"><strong><span>Next</span><b>AI</b></strong><small>COMMERCE</small></span></a><div th:replace="~{fragments/sidebar-nav :: nav('overview')}"></div><div th:replace="~{fragments/sidebar-user :: user}"></div></aside>
  <main class="workspace"><header class="workspace-header"><div><span class="eyebrow dark">Workspace</span><h1>Platform foundation</h1><p class="page-intro">A secure home for every marketplace operation.</p></div><div class="header-actions"><div th:replace="~{fragments/context-switcher :: switcher}"></div></div></header><div th:replace="~{fragments/background-sync-notice :: notice}"></div><div th:replace="~{fragments/sync-onboarding :: onboarding(${syncStatuses},${syncJobsByConnection})}"></div><section class="empty-state" th:if="${#lists.isEmpty(syncStatuses)}"><span class="status-dot"></span><h2>Your secure workspace is ready.</h2><p>Your menus are tailored to your role. Marketplace data will also be limited to the stores assigned to your account.</p><a class="primary-link" th:if="${canManageUsers}" href="/app/users">Open Users &amp; Access <span>→</span></a><a class="primary-link" th:if="${canViewOperations and !canManageUsers}" href="/app/orders">Open Orders <span>→</span></a></section></main>
<script th:if="${syncInProgress}">window.setTimeout(() => window.location.reload(), 8000);</script>
<th:block th:replace="~{fragments/collaboration-runtime :: body}"></th:block></body></html>
