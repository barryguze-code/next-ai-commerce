<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div class="sidebar-user" th:fragment="user">
  <th:block th:replace="~{fragments/release-notice :: notice}"></th:block>
  <th:block th:replace="~{fragments/ux-components :: runtime}"></th:block>
  <link rel="stylesheet" href="/css/confirm-dialog.css"><script defer src="/js/confirm-dialog.js?v=1.11.8"></script>
  <link rel="stylesheet" href="/css/product-thumbnails.css?v=1.7.2">
  <link rel="stylesheet" href="/css/short-date-input.css?v=20261002-1">
  <script defer src="/js/short-date-input.js?v=1.11.1-expiry-entry"></script>
  <link rel="stylesheet" href="/css/huddle-floating.css?v=1.11.12">
  <script src="/js/huddle-floating.js?v=1.11.12"></script>
  <link rel="stylesheet" href="/css/chat-composer.css?v=1.11.11">
  <link rel="stylesheet" href="/css/collaboration-accessibility.css?v=20261008-1">
  <script defer src="/js/chat-composer.js?v=1.6.6"></script>
  <link rel="stylesheet" href="/css/general-task.css?v=20261002-5">
  <script defer src="/js/general-task.js?v=1.11.5"></script>
  <link rel="stylesheet" href="/css/collaboration-task-dates.css?v=1.6.6">
  <script defer src="/js/collaboration-task-dates.js?v=20261102-scope1"></script>
  <span id="general-task-context" hidden th:attr="data-account=${selectedAccountId},data-account-name=${selectedAccountName},data-store=${selectedStoreId},data-store-name=${selectedStoreName},data-logo=${selectedAccountLogoUrl}"></span>
  <script defer src="/js/collaboration.js?v=1.11.11"></script>
  <script defer src="/js/collaboration-read-receipts.js?v=personal27"></script>
  <script src="/js/theme.js?v=20260905-1"></script>
  <script src="/js/platform-icons.js?v=20261031-local"></script>
  <link rel="stylesheet" href="/css/table-widget.css?v=1.9.0">
  <script defer src="/js/table-preferences.js?v=20261002-perf1"></script>
  <script defer src="/js/table-widget.js?v=1.11.0"></script>
  <script defer src="/js/table-data-tools.js?v=shopify-orders-1"></script>
  <link rel="stylesheet" href="/css/background-jobs.css?v=1.7.1">
  <script defer src="/js/background-jobs.js?v=1.7.1"></script>
  <link rel="stylesheet" href="/css/profile-picture.css">
  <script defer src="/js/profile-picture.js"></script>
  <button type="button" class="sidebar-user-avatar profile-picture-trigger" title="Edit your profile picture" aria-label="Edit your profile picture"><span th:text="${#strings.toUpperCase(#strings.substring(signedInEmail,0,1))}">B</span><img src="/app/profile/picture" alt="Your profile picture"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 16-1 4 4-1L20 7l-3-3Z M14 7l3 3"/></svg></button>
  <span class="sidebar-user-copy"><strong th:text="${signedInEmail}" th:title="${signedInEmail}">Signed-in user</strong></span>
  <link rel="stylesheet" href="/css/release-panel.css?v=1.0.3">
  <script defer src="/js/release-panel.js?v=1.0.3"></script>
  <a class="sidebar-build-info release-trigger" href="/app/releases" aria-haspopup="dialog" th:attr="data-release-version=${buildVersion},data-release-user=${signedInEmail},data-release-notification=${#strings.isEmpty(buildBranch)}" th:title="${'What’s new · Running '+buildVersion}"><span style="display:flex;flex-direction:column;gap:3px;min-width:0;white-space:normal;overflow-wrap:anywhere"><span th:text="${#strings.isEmpty(buildBranch) ? 'v'+displayVersion : 'v'+buildVersion}">Version</span><small th:unless="${#strings.isEmpty(buildBranch)}" th:text="${buildBranch}">Branch</small></span><span class="release-unread-dot" hidden aria-label="New release notes"></span><span aria-hidden="true">›</span></a>
  <div class="text-size-control">
    <button class="text-size-trigger" data-text-size-toggle type="button" aria-label="Adjust text size" title="Adjust text size" aria-expanded="false" onclick="toggleTextSizeMenu(this,event)">Aa</button>
    <section class="text-size-popover" data-text-size-menu hidden aria-label="Text size settings">
      <header><span><strong>Text size</strong><small>Menus, tables, and dialogs</small></span><output data-text-size-output>Standard</output></header>
      <div class="text-size-slider"><span aria-hidden="true">A</span><input data-text-size-range type="range" min="0" max="2" step="1" value="1" aria-label="Platform text size" oninput="setPlatformTextSize(['compact','standard','larger'][this.value])"><strong aria-hidden="true">A</strong></div>
      <div class="text-size-labels" aria-hidden="true"><span>Compact</span><span>Standard</span><span>Larger</span></div>
      <p>Changes immediately and is remembered on this browser.</p>
    </section>
  </div>
  <button class="theme-toggle" data-theme-toggle type="button" aria-label="Use dark appearance" title="Use dark appearance" aria-pressed="false" onclick="togglePlatformTheme()">
    <svg class="moon-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 15.2A8 8 0 0 1 8.8 4 8.5 8.5 0 1 0 20 15.2Z"/></svg>
    <svg class="sun-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
  <form method="post" th:action="@{/logout}">
    <button type="submit" aria-label="Sign out" title="Sign out">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 8V5H4v14h10v-3M10 12h10m-3-3 3 3-3 3"/></svg>
    </button>
  </form>
</div>
</body>
</html>
