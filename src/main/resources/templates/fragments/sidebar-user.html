<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div class="sidebar-user" th:fragment="user">
  <script src="/js/theme.js"></script>
  <span class="sidebar-user-avatar" th:text="${#strings.toUpperCase(#strings.substring(signedInEmail,0,1))}">B</span>
  <span class="sidebar-user-copy"><strong th:text="${signedInEmail}">Signed-in user</strong><small th:text="${roleLabel}">Member</small></span>
  <button class="theme-toggle" data-theme-toggle type="button" aria-label="Use dark appearance" title="Use dark appearance" aria-pressed="false" onclick="togglePlatformTheme()">
    <svg class="moon-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 15.2A8 8 0 0 1 8.8 4 8.5 8.5 0 1 0 20 15.2Z"/></svg>
    <svg class="sun-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
  <form method="post" th:action="@{/logout}">
    <button type="submit" aria-label="Sign out" title="Sign out">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 8V5H4v14h10v-3M10 12h10m-3-3 3 3-3 3"/></svg>
    </button>
  </form>
</div>
</body>
</html>
