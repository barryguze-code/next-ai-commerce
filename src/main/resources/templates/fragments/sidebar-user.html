<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div class="sidebar-user" th:fragment="user">
  <script src="/js/theme.js?v=20260905-1"></script>
  <link rel="stylesheet" href="/css/table-widget.css?v=20260913-4">
  <script defer src="/js/table-preferences.js?v=20260911-2"></script>
  <script defer src="/js/table-widget.js?v=20260913-4"></script>
  <script defer src="/js/table-data-tools.js?v=1.0.1"></script>
  <link rel="stylesheet" href="/css/background-jobs.css?v=1.0.0">
  <script defer src="/js/background-jobs.js?v=1.0.0"></script>
  <span class="sidebar-user-avatar" th:text="${#strings.toUpperCase(#strings.substring(signedInEmail,0,1))}">B</span>
  <span class="sidebar-user-copy"><strong th:text="${signedInEmail}" th:title="${signedInEmail}">Signed-in user</strong></span>
  <a class="sidebar-build-info" href="/app/releases" th:text="${#strings.isEmpty(buildBranch) ? 'v'+displayVersion : buildBranch}" th:title="${'What’s new · Running '+buildVersion}">v1.0.1</a>
  <div class="text-size-control">
    <button class="text-size-trigger" data-text-size-toggle type="button" aria-label="Adjust text size" title="Adjust text size" aria-expanded="false" onclick="toggleTextSizeMenu(this,event)">Aa</button>
    <section class="text-size-popover" data-text-size-menu hidden aria-label="Text size settings">
      <header><span><strong>Text size</strong><small>Menus, tables, and dialogs</small></span><output data-text-size-output>Standard</output></header>
      <div class="text-size-slider"><span aria-hidden="true">A</span><input data-text-size-range type="range" min="0" max="2" step="1" value="1" aria-label="Platform text size" oninput="setPlatformTextSize(['compact','standard','larger'][this.value])"><strong aria-hidden="true">A</strong></div>
      <div class="text-size-labels" aria-hidden="true"><span>Compact</span><span>Standard</span><span>Larger</span></div>
      <p>Changes immediately and is remembered on this browser.</p>
    </section>
  </div>
  <button class="theme-toggle" data-theme-toggle type="button" aria-label="Use dark appearance" title="Use dark appearance" aria-pressed="false" onclick="togglePlatformTheme()">
    <svg class="moon-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 15.2A8 8 0 0 1 8.8 4 8.5 8.5 0 1 0 20 15.2Z"/></svg>
    <svg class="sun-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
  <form method="post" th:action="@{/logout}">
    <button type="submit" aria-label="Sign out" title="Sign out">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 8V5H4v14h10v-3M10 12h10m-3-3 3 3-3 3"/></svg>
    </button>
  </form>
</div>
</body>
</html>
