<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<details class="context-menu" th:fragment="switcher" th:attr="open=${chooseStore == true ? 'open' : null}">
  <summary class="context-switcher" aria-label="Choose business account or marketplace store">
    <span class="context-icon">◎</span>
    <span class="context-copy"><small th:text="${selectedStoreName == null ? 'Current account' : selectedAccountName}">Current account</small><strong th:text="${selectedStoreName == null ? selectedAccountName : selectedStoreName}">Selected account</strong></span>
    <span class="chevron">⌄</span>
  </summary>
  <section class="context-popover">
    <header><strong>Choose workspace</strong><small>Accounts and connected stores</small></header>
    <div class="context-account" th:each="option : ${accountOptions}">
      <form method="post" th:action="@{/app/select-account}">
        <input type="hidden" name="tenantId" th:value="${option.id}"><input type="hidden" name="tenantName" th:value="${option.name}">
        <button class="context-account-button" type="submit" th:classappend="${option.id == selectedAccountId ? ' selected' : ''}"><span class="avatar" th:text="${option.initials}">BA</span><span><strong th:text="${option.name}">Business account</strong><small th:text="${option.stores.size() + ' connected store(s)'}">Stores</small></span><b>›</b></button>
      </form>
      <div class="context-stores" th:if="${!#lists.isEmpty(option.stores)}">
        <form method="post" th:action="@{/app/select-store}" th:each="store : ${option.stores}">
          <input type="hidden" name="tenantId" th:value="${option.id}"><input type="hidden" name="tenantName" th:value="${option.name}"><input type="hidden" name="storeId" th:value="${store.id}"><input type="hidden" name="storeName" th:value="${store.name}">
          <button type="submit" th:classappend="${store.id == selectedStoreId ? ' selected' : ''}"><span class="mini-channel" th:classappend="${store.channel == 'WALMART' ? ' walmart-channel' : ' amazon-channel'}"><img th:src="${store.channel == 'AMAZON' ? '/images/channels/amazon-official.png' : '/images/channels/walmart-official.png'}" alt=""></span><span><strong th:text="${store.name}">Store</strong><small th:text="${store.countryFlag + ' ' + store.marketplaceLabel}">Marketplace</small></span></button>
        </form>
      </div>
      <p class="context-no-stores" th:if="${#lists.isEmpty(option.stores)}">No connected stores</p>
    </div>
  </section>
</details>
</body></html>
