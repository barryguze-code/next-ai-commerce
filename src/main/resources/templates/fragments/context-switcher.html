<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<details class="context-menu" th:fragment="switcher" th:attr="open=${chooseStore == true ? 'open' : null}">
  <summary class="context-switcher" aria-label="Choose business account or marketplace store">
    <span th:if="${canManageUsers == true}" class="context-brand-edit context-icon context-account-initials" role="button" tabindex="0" th:unless="${selectedAccountLogoUrl != null}" th:text="${selectedAccountInitials}" title="Edit company logo" onclick="event.preventDefault();event.stopPropagation();openAccountBrandDialog()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openAccountBrandDialog()}">BA</span>
    <span th:if="${canManageUsers == true and selectedAccountLogoUrl != null}" class="context-brand-edit" role="button" tabindex="0" title="Edit company logo" onclick="event.preventDefault();event.stopPropagation();openAccountBrandDialog()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openAccountBrandDialog()}"><img class="context-brand-logo" th:src="${selectedAccountLogoUrl}" alt="Company logo"></span>
    <span th:if="${canManageUsers != true}" class="context-icon context-account-initials" th:unless="${selectedAccountLogoUrl != null}" th:text="${selectedAccountInitials}">BA</span>
    <img th:if="${canManageUsers != true and selectedAccountLogoUrl != null}" class="context-brand-logo" th:src="${selectedAccountLogoUrl}" alt="Company logo">
    <span class="context-copy"><strong th:text="${selectedStore == null ? selectedAccountName : selectedStore.name}">Selected store</strong><small th:if="${selectedStore == null}">All stores · Account overview</small><small th:if="${selectedStore != null}" th:text="${selectedStore.countryFlag + ' ' + selectedStore.marketplaceLabel}">🇺🇸 Amazon US</small></span>
    <span class="context-selected-channel" th:if="${selectedStore != null}" th:classappend="${selectedStore.channel == 'WALMART' ? ' walmart-channel' : ' amazon-channel'}"><img th:src="${selectedStore.channel == 'AMAZON' ? '/images/channels/amazon-round-transparent.png' : '/images/channels/walmart-official.png'}" th:alt="${selectedStore.channel}"></span>
    <span class="chevron">⌄</span>
  </summary>
  <section class="context-popover">
    <header><strong>Choose workspace</strong><small>Accounts and connected stores</small></header>
    <label class="context-filter"><span>⌕</span><input type="search" placeholder="Search accounts or stores" aria-label="Search accounts or stores" oninput="filterWorkspaceChoices(this)"></label>
    <div class="context-account" th:each="option : ${accountOptions}" th:attr="data-account-search=${#strings.toLowerCase(option.name)}">
      <form method="post" th:action="@{/app/select-account}">
        <input type="hidden" name="tenantId" th:value="${option.id}"><input type="hidden" name="tenantName" th:value="${option.name}">
        <button class="context-account-button" type="submit" th:classappend="${option.id == selectedAccountId and selectedStore == null ? ' selected' : ''}"><span class="avatar" th:if="${option.logoUrl == null}" th:text="${option.initials}">BA</span><img class="account-brand-logo" th:if="${option.logoUrl != null}" th:src="${option.logoUrl}" alt=""><span><strong th:text="${'All stores — ' + option.name}">All stores — Business account</strong><small th:text="${'Combined overview · ' + option.stores.size() + ' connected store(s)'}">Combined overview</small></span><b>›</b></button>
      </form>
      <div class="context-stores" th:if="${!#lists.isEmpty(option.stores)}">
        <form method="post" th:action="@{/app/select-store}" th:each="store : ${option.stores}" th:attr="data-store-search=${#strings.toLowerCase(store.name + ' ' + store.channel + ' ' + store.marketplaceLabel)}">
          <input type="hidden" name="tenantId" th:value="${option.id}"><input type="hidden" name="tenantName" th:value="${option.name}"><input type="hidden" name="storeId" th:value="${store.id}"><input type="hidden" name="storeName" th:value="${store.name}"><input type="hidden" name="returnTo" th:value="${currentWorkspacePath}">
          <button type="submit" th:classappend="${store.id == selectedStoreId ? ' selected' : ''}"><span class="mini-channel" th:classappend="${store.channel == 'WALMART' ? ' walmart-channel' : ' amazon-channel'}"><img th:src="${store.channel == 'AMAZON' ? '/images/channels/amazon-official.png' : '/images/channels/walmart-official.png'}" alt=""></span><span><strong th:text="${store.name}">Store</strong><small th:text="${store.countryFlag + ' ' + store.marketplaceLabel}">Marketplace</small></span></button>
        </form>
      </div>
      <p class="context-no-stores" th:if="${#lists.isEmpty(option.stores)}">No connected stores</p>
    </div>
  </section>
  <dialog id="account-brand-dialog" class="invite-dialog"><form method="post" enctype="multipart/form-data" th:action="@{/app/platform/accounts/{id}/logo(id=${selectedAccountId})}" class="dialog-shell"><div class="dialog-header"><div><span class="eyebrow dark">Company identity</span><h2>Update company logo</h2><p>This logo appears in the workspace picker and selected-store control.</p></div><button class="dialog-close" type="button" onclick="this.closest('dialog').close()">×</button></div><div class="dialog-body operation-form"><label>Company logo<input name="logo" type="file" accept="image/png,image/jpeg,image/webp" required><small>PNG, JPEG, or WebP up to 2 MB.</small></label></div><div class="dialog-actions"><button class="secondary-button" type="button" onclick="this.closest('dialog').close()">Cancel</button><button class="primary-button compact-button" type="submit">Save logo</button></div></form></dialog>
  <script>function filterWorkspaceChoices(input){const query=input.value.trim().toLowerCase();const popover=input.closest('.context-popover');popover.querySelectorAll('.context-account').forEach(account=>{const accountMatch=account.dataset.accountSearch.includes(query);let storeMatch=false;account.querySelectorAll('[data-store-search]').forEach(store=>{const match=!query||accountMatch||store.dataset.storeSearch.includes(query);store.hidden=!match;storeMatch=storeMatch||match;});account.hidden=!!query&&!accountMatch&&!storeMatch;});}function openAccountBrandDialog(){const dialog=document.getElementById('account-brand-dialog');if(!dialog)return;if(dialog.parentElement!==document.body)document.body.appendChild(dialog);if(!dialog.open)dialog.showModal();}</script>
</details>
</body></html>
