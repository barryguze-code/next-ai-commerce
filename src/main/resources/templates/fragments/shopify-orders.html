<!doctype html><html xmlns:th="http://www.thymeleaf.org"><body><div th:fragment="orders" data-order-stream th:attr="data-stream-key=${orderStreamKey}" aria-live="polite">
<section class="data-card order-card">
  <div class="card-toolbar order-toolbar"><div><div class="stream-heading"><h2>Orders</h2><span class="live-indicator" tabindex="0" th:title="${shopifyOrderJob == null ? 'No completed Shopify order check' : shopifyOrderJob.message}" th:classappend="${shopifyOrderJob != null and shopifyOrderJob.running() ? ' syncing' : !shopifyOrderSetup.ordersPermitted or shopifyOrderJob == null or shopifyOrderJob.state != 'COMPLETED' ? ' stale' : ''}"><i></i><span th:text="${shopifyOrderJob != null and shopifyOrderJob.running() ? 'Syncing' : shopifyOrderSetup.ordersPermitted and shopifyOrderJob != null and shopifyOrderJob.state == 'COMPLETED' ? 'Synced' : 'Needs attention'}"></span></span></div>
    <div class="order-sync-status"><small class="order-sync-time" th:text="${shopifyOrderJob == null or shopifyOrderJob.checkedAt == null ? 'No completed Shopify order check' : 'Last Shopify order check · '+orderTime.format(shopifyOrderJob.checkedAt)}"></small>
      <form th:if="${canSyncShopifyOrders}" method="post" th:action="@{/app/orders/sync}"><button class="order-sync-button" type="submit" th:disabled="${!shopifyOrderSetup.ordersPermitted or (shopifyOrderJob != null and shopifyOrderJob.running())}"><span aria-hidden="true">↻</span><span th:text="${shopifyOrderJob != null and shopifyOrderJob.running() ? 'Syncing…' : 'Sync now'}"></span></button></form><form th:if="${canSyncShopifyOrders and shopifyOrderJob != null and shopifyOrderJob.running()}" method="post" th:action="@{/app/orders/shopify/cancel}"><button class="order-sync-button" type="submit">Cancel sync</button></form>
    </div></div><form method="get" class="order-search"><input type="hidden" name="status" th:value="${selectedStatus}"><label class="search-field"><span aria-hidden="true">⌕</span><input type="search" name="q" th:value="${query}" placeholder="Search order, brand, SKU, product or item code" aria-label="Search Shopify orders"></label><button class="secondary-button compact-button">Search</button></form></div>
  <div class="order-tab-panel compact-order-tabs"><span class="order-tab-caption">Orders/Units</span><nav class="order-filters" aria-label="Orders and alerts"><th:block th:replace="~{fragments/order-tabs :: tabs(${shopifyOrderTabs},${shopifyOrdersPage.size})}"></th:block><a th:if="${selectedStatus != 'ALL'}" class="secondary-button compact-button" data-orders-clear-status th:href="@{/app/orders(status='ALL',q=${query},size=${shopifyOrdersPage.size})}">Clear status filter</a></nav><div data-column-control="orders"></div></div>
  <div class="order-list table-widget-scroll" data-table-widget="orders" data-provider="SHOPIFY" data-layout-version="20261005-pricing"><div class="table-grid-header order-item-grid-header">
    <span data-column="product" data-title="Product details" data-column-required="true">Product details</span><span data-column="order" data-title="Order ID &amp; status" data-column-required="true">Order ID &amp; status</span><span data-column="quantity" data-title="Quantity">Qty</span><span data-column="sales" data-title="Item Sales">Item Sales</span><span data-column="available" data-title="Available">Available</span><span data-column="four-week-sales" data-title="4 WEEK SALES">4 WEEK SALES</span><span data-column="profit" data-title="Order profit">Profit</span><span data-column="action" data-title="Actions" data-column-required="true">Actions</span></div>
    <article class="order-row open" th:each="order:${shopifyOrdersPage.rows}" th:classappend="${order.rowClass()+' '+(order.lines.size() > 1 ? 'multi-order' : 'single-order')}"><div class="order-items">
      <div class="order-item" th:each="item,itemStat:${order.lines}" th:attr="data-export-product=${item.title},data-export-sku=${item.sku},data-export-mapping=${item.mappedItems()},data-export-order=${order.name},data-export-date=${order.created.toString()},data-export-payment=${order.payment},data-export-status=${order.fulfillment},data-export-cancelled=${order.cancelled},data-export-readiness=${item.stateLabel()},data-export-quantity=${item.quantity},data-export-open=${item.open},data-export-sales=${item.total},data-export-currency=${item.currency},data-export-available=${item.available}">
        <div class="item-product"><div class="item-image order-product-stage product-thumbnail-slot" data-picture-actions th:attr="data-provider='SHOPIFY',data-item-id=${item.id},data-variant-id=${item.variant},data-variant-revision=${item.revision},data-seller-sku=${item.sku},data-product-title=${item.title},data-can-edit=${canSyncShopifyOrders},data-can-edit-picture='false',data-mapping=${item.mapped() ? 'MAPPED' : 'UNMAPPED'},data-admin-url=${item.adminUrl}" th:with="conversation=${shopifyOrderThreads.get(order.subjectKey())}">
          <img th:if="${item.image != null}" th:src="${item.image}" alt="">
          <button th:if="${itemStat.first}" class="collaboration-row-button order-stage-chat" type="button" th:attr="data-entity-type='ORDER',data-entity-id=${order.subjectKey()},data-title=${'Shopify order '+order.name},data-identifier=${order.name},data-status=${order.fulfillment},data-marketplace='Shopify',data-parent-url=@{/app/orders(q=${order.name})},data-can-collaborate=${canSyncShopifyOrders},data-active-count=${conversation == null ? 0 : conversation.activeCount},data-total-count=${conversation == null ? 0 : conversation.totalCount},data-closed-count=${conversation == null ? 0 : conversation.closedCount}" onclick="openRecordCollaboration(this)" aria-label="Start or open order collaboration"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5.5h14v9H9l-4 4v-13Z"/></svg><b th:if="${conversation != null and conversation.totalCount > 0}" th:text="${conversation.totalCount}"></b></button>
        </div><div class="item-product-copy"><strong th:text="${item.title}"></strong><div class="order-identifier-line"><span class="order-identifier-market"><img src="/images/channels/shopify-bag.png" alt="Shopify"></span><button type="button" class="order-sku-copy" th:attr="data-copy-sku=${item.sku},aria-label=${'Copy SKU '+item.sku}"><code th:text="${#strings.isEmpty(item.sku) ? 'No seller SKU' : item.sku}"></code><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V4H4v12h4"/></svg></button></div>
          <div class="shopify-order-mapping order-mapping-inline" th:if="${item.variant != null}"><button type="button" class="order-inline-mapping-trigger" th:classappend="${item.mapped() ? 'is-mapped' : 'needs-mapping'}" aria-label="Review SKU mapping" title="Review marketplace SKU mapping. Existing order reservations keep their saved products and quantities." th:attr="data-provider='SHOPIFY',data-order-line-id=${item.id},data-variant-id=${item.variant},data-variant-revision=${item.revision},data-seller-sku=${item.sku},data-product-title=${item.title},data-image=${item.image},data-can-edit=${canSyncShopifyOrders}" onclick="NextAiMappingWidget.open(this)"><img th:src="${item.mapped() ? '/images/platform/table/sku-mapped.png' : '/images/platform/table/sku-not-mapped.png'}" alt=""></button><div class="order-mapping-values"><div class="order-identifier-line" th:each="part:${item.parts}"><a class="order-copy-value" th:attrappend="data-order-ledger-item=${part.item},data-order-ledger-code=${part.code},data-order-ledger-quantity=${part.quantity}" th:href="@{/app/inventory/ledger(itemId=${part.item})}" title="Inventory Ledger" th:attr="aria-label=${'Inventory Ledger · '+(part.code ?: 'Item code unavailable')}" th:text="${(part.code ?: 'Item code unavailable')+' × '+part.quantity.stripTrailingZeros().toPlainString()}"></a></div><button th:unless="${item.mapped()}" type="button" class="mapping-unmapped-badge mapping-warning-trigger" th:attr="aria-label=${'Map '+item.title}" onclick="this.closest('.order-mapping-inline').querySelector('.order-inline-mapping-trigger').click()">Unmapped</button></div></div>
        </div></div>
        <div class="item-order-reference"><a class="order-number" th:href="${order.adminUrl}" target="_blank" rel="noopener noreferrer" th:aria-label="${'Open Shopify order '+order.name}"><img src="/images/channels/shopify-bag.png" width="18" height="18" alt="Shopify"><span th:text="${order.name}"></span></a><small th:text="${orderTime.format(order.created)}"></small><span class="amazon-order-status" th:attr="data-tone=${order.statusTone()}" th:text="${order.statusLabel()}"></span><span th:if="${item.actionRequired() and item.state != 'NEEDS_MAPPING'}" class="mapping-unmapped-badge" th:text="${item.stateLabel()}" th:title="${item.review}"></span><small th:if="${item.review != null}" th:text="${item.review}"></small></div>
        <div class="item-number"><small>Qty</small><strong th:text="${item.quantity}"></strong></div>
        <div class="item-number item-sales"><small>Item Sales</small><strong th:text="${item.currency+' '+#numbers.formatDecimal(item.total,1,2)}"></strong></div>
        <div class="item-number"><small>Warehouse available</small><strong th:text="${item.available == null ? '—' : item.available.stripTrailingZeros().toPlainString()}"></strong></div>
        <div class="item-weekly-sales" data-column="four-week-sales" data-title="4 WEEK SALES"><strong th:if="${item.weekly != null}" class="weekly-sales" th:text="${item.weekly}" title="Current units on non-test, non-cancelled Shopify orders; rolling seven-day periods, oldest first"></strong><span th:unless="${item.weekly != null}" class="cell-note">Awaiting complete sync</span></div>
        <div class="item-profit" data-column="profit" data-title="Order profit"><button class="profit-open" type="button" data-profit-kind="SHOPIFY_ORDER" th:attr="data-profit-key=${order.id},data-profit-sku=${item.sku}"><span>Pending</span><small>Est. item</small><img class="profit-calculator-art" src="/images/platform/table/profit-calculator.png" alt=""></button></div>
        <div class="item-actions"><button th:if="${itemStat.first and fedexSandboxLabelTest != true and canSyncShopifyOrders and shopifyShippingSandbox == true and order.sandboxShippingEligible()}" type="button" class="order-icon-action fedex-order-action" data-fedex-shipping th:attr="data-order-id=${order.id}" onclick="window.openFedExShipping(this)" title="Buy shipping" aria-label="Buy shipping"><img src="/images/channels/fedex-official.png" width="26" height="18" alt="FedEx"></button><span th:if="${itemStat.first}" hidden data-provider="SHOPIFY" th:attr="data-packing-slip-order=${order.id}"></span><th:block th:replace="~{fragments/order-pickup-action :: pickup(${order.id},${order.marked},${itemStat.first and canSyncShopifyOrders and order.pickupEligible()})}"></th:block></div>
      </div>
      <p class="notice" th:if="${order.lines.isEmpty()}"><a th:href="${order.adminUrl}" target="_blank" rel="noopener noreferrer" th:text="${order.name}"></a> · Order details require complete source evidence.</p>
      <p class="notice error" th:unless="${order.complete}" th:text="${order.review ?: 'Incomplete source evidence; warehouse operations held.'}"></p>
    </div></article><div class="order-empty-state" th:if="${shopifyOrdersPage.rows.isEmpty()}"><h3>No Shopify orders match this view</h3><p th:text="${shopifyOrderJob != null and shopifyOrderJob.running() ? 'Orders are being imported in the background.' : 'Try another search or order status.'}"></p></div>
  </div>
  <footer class="table-footer table-pagination order-pagination" th:attr="data-page=${shopifyOrdersPage.page},data-page-max=${shopifyOrdersPage.totalPages()},data-page-size=${shopifyOrdersPage.size}"><span th:text="${'Total: '+shopifyOrdersPage.total+' orders'}"></span><nav aria-label="Shopify order pages"><a th:if="${shopifyOrdersPage.hasPrevious()}" th:href="@{/app/orders(q=${query},status=${selectedStatus},page=${shopifyOrdersPage.page-1},size=${shopifyOrdersPage.size})}">Previous</a><span th:text="${'Page '+shopifyOrdersPage.displayPage()+' of '+shopifyOrdersPage.totalPages()}"></span><a th:if="${shopifyOrdersPage.hasNext()}" th:href="@{/app/orders(q=${query},status=${selectedStatus},page=${shopifyOrdersPage.page+1},size=${shopifyOrdersPage.size})}">Next</a></nav></footer>
</section></div></body></html>
