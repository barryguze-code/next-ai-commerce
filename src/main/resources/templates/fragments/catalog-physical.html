<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><body>
<section th:fragment="fields(physical)" class="catalog-account-details" th:with="us=${selectedStore == null or selectedStore.marketplaceId == 'ATVPDKIKX0DER'},weightDefault=${us ? 'oz' : 'g'},dimensionDefault=${us ? 'in' : 'cm'}">
<input type="hidden" name="physicalRevision" th:value="${physical?.revision()}">
<h3>Shared product details</h3><p class="cell-note">Changes apply to linked accounts.</p>
<div class="form-pair"><label>Units / case<input name="masterCase" type="number" min="1" step="1" required th:value="${physical == null ? 1 : physical.masterCase.stripTrailingZeros().toPlainString()}"></label>
<div class="catalog-weight-field"><span>Weight</span><div class="form-pair"><input aria-label="Weight" name="netWeight" type="number" min="0.0001" step="0.0001" th:value="${physical?.netWeight}"><select name="weightUnit" data-standard-choice aria-label="Weight unit"><option th:each="unit:${ {'oz','lb','g','kg'} }" th:value="${unit}" th:selected="${unit == (physical == null or physical.weightUnit == null ? weightDefault : physical.weightUnit)}" th:text="${unit}"></option></select></div></div></div>
<div class="catalog-measurement-grid"><label>Length<input name="length" type="number" min="0.0001" step="0.0001" th:value="${physical?.length}"></label><label>Width<input name="width" type="number" min="0.0001" step="0.0001" th:value="${physical?.width}"></label>
<label>Height<input name="height" type="number" min="0.0001" step="0.0001" th:value="${physical?.height}"></label><label>Dimension unit<select name="dimensionUnit" data-standard-choice aria-label="Dimension unit"><option value="in" th:selected="${(physical == null or physical.dimensionUnit == null) ? dimensionDefault == 'in' : physical.dimensionUnit == 'in'}">in</option><option value="cm" th:selected="${(physical == null or physical.dimensionUnit == null) ? dimensionDefault == 'cm' : physical.dimensionUnit == 'cm'}">cm</option></select></label></div>
</section></body></html>
