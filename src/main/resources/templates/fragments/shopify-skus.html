<!doctype html><html xmlns:th="http://www.thymeleaf.org"><body>
<section th:fragment="listings" class="data-card sku-card shopify-listings" th:if="${shopifyPage != null and (shopifyPage.total > 0 or shopifyJob != null)}">
  <header class="card-toolbar sku-toolbar"><div class="sku-sync-heading"><div class="sku-sync-title"><h2>Marketplace listings</h2><span th:if="${shopifyJob != null}" class="sku-sync-indicator" th:classappend="${shopifyJob.running() ? 'syncing' : shopifyJob.state != 'COMPLETED' ? 'not-synced' : ''}" role="status" th:text="${shopifyJob.statusLabel()}" th:title="${shopifyJob.message}"></span></div>
    <div class="sku-sync-status"><small th:text="${shopifyJob == null ? 'No Shopify SKU check yet' : shopifyJob.lastCheckLabel()}"></small><form th:if="${canSyncShopify == true and shopifyJob != null}" method="post" th:action="@{/app/marketplace-skus/shopify/sync}"><button type="submit" class="sku-sync-button" th:disabled="${!shopifySetup.productsPermitted or shopifyJob.running()}" th:title="${shopifyJob.message}"><span aria-hidden="true">↻</span><span th:text="${shopifyJob.running() ? 'Syncing…' : 'Sync now'}">Sync now</span></button></form><form th:if="${canSyncShopify == true and shopifyJob != null and (shopifyJob.running() or shopifyJob.state == 'INTERRUPTED')}" method="post" th:action="@{/app/marketplace-skus/shopify/cancel}"><button class="sku-sync-button" type="submit">Cancel sync</button></form></div></div></header>
  <div class="sku-toolbar-actions table-widget-tools"><form class="sku-search" method="get" action="/app/marketplace-skus"><input type="hidden" name="status" th:value="${selectedStatus}"><input type="hidden" name="sort" th:value="${selectedSort}"><input type="hidden" name="direction" th:value="${sortDirection}"><label class="search-field"><input name="q" type="search" th:value="${query}" placeholder="Search SKU, barcode, product, or item code" aria-label="Search Shopify variants"></label><button class="secondary-button" type="submit">Search</button></form><div data-column-control="shopify-marketplace-skus"></div></div>

  <div id="marketplace-listings-table-wrap" class="table-wrap sku-table-wrap" tabindex="0" role="region" aria-label="Shopify marketplace variants">
  <nav class="sku-filter-bar" aria-label="Shopify product status"><a th:if="${state == 'ALL' or shopifyCounts.getOrDefault(state,0) > 0 or selectedStatus == state}" th:each="state:${shopifyStatuses}" th:classappend="${(selectedStatus == state ? 'active ' : '')+(state == 'UNMAPPED' ? 'sku-alert-tab shopify-exception-tab' : '')}" th:attr="title=${state == 'DRAFT' ? 'Draft: unpublished in Shopify. No action is required unless you intend to publish it.' : null},aria-current=${selectedStatus == state ? 'page' : null}" th:href="@{/app/marketplace-skus(q=${query},status=${state},sort=${selectedSort},direction=${sortDirection})}"><span th:text="${state == 'ALL' ? 'All' : state == 'UNMAPPED' ? 'Unmapped' : #strings.capitalize(#strings.toLowerCase(state))}"></span><b th:if="${shopifyCounts.containsKey(state)}" th:text="${shopifyCounts.get(state)}"></b></a></nav>
  <table id="marketplace-listings-table" class="sku-table" data-server-sort data-table-widget="shopify-marketplace-skus" data-table-min-width="1240" data-layout-version="shopify-variants-v1"><thead><tr>
    <th data-column="product-details" data-column-required="true"><a th:href="@{/app/marketplace-skus(q=${query},status=${selectedStatus},sort='listing',direction=${selectedSort == 'listing' and sortDirection == 'asc' ? 'desc' : 'asc'})}">Product details</a></th>
    <th data-column="status"><a th:href="@{/app/marketplace-skus(q=${query},status=${selectedStatus},sort='status',direction=${selectedSort == 'status' and sortDirection == 'asc' ? 'desc' : 'asc'})}">Product status</a></th>
    <th data-column="price-shipping"><a th:href="@{/app/marketplace-skus(q=${query},status=${selectedStatus},sort='price',direction=${selectedSort == 'price' and sortDirection == 'asc' ? 'desc' : 'asc'})}">Price</a></th><th data-column="available">Available</th><th data-column="4w-sales">4w sales</th><th data-column="profit">Profit</th>
  </tr></thead><tbody>
    <tr th:each="row:${shopifyPage.rows}" th:with="parts=${shopifyComponents.getOrDefault(row.id,{})},conversation=${shopifyThreads.get(row.subjectKey())}" th:attr="data-listing-id=${row.id},data-sku=${row.sku ?: ''},data-entity-type='MARKETPLACE_SKU',data-entity-id=${row.subjectKey()},data-title=${row.title},data-can-collaborate=${canSyncShopify}">
      <td data-label="Product details"><div class="sku-approved-product">
        <span class="sku-image product-avatar"><img th:if="${row.image != null}" th:src="${row.image}" th:alt="${row.title}" loading="lazy" onerror="this.hidden=true;this.nextElementSibling.hidden=false"><b th:hidden="${row.image != null}" th:text="${#strings.substring(row.title,0,1)}">P</b></span>
        <strong class="sku-approved-title" th:text="${row.title}">Product</strong><small th:if="${!#strings.isEmpty(row.optionsLabel())}" class="shopify-options" th:text="${row.optionsLabel()}"></small>
        <div class="sku-identifier-line"><a class="sku-identifier-icon" th:href="${row.adminUrl()}" target="_blank" rel="noopener noreferrer" aria-label="Open variant in Shopify Admin"><img src="/images/channels/shopify-bag.png" alt=""></a><button type="button" class="sku-copy-value" th:attr="data-copy-value=${row.sku}" th:disabled="${#strings.isEmpty(row.sku)}" th:text="${row.skuLabel()}">No SKU</button><a th:if="${row.storefront != null}" th:href="${row.storefront}" target="_blank" rel="noopener noreferrer" aria-label="Open product on Shopify storefront"><span aria-hidden="true">↗</span></a></div>
        <div class="sku-identifier-line sku-approved-mapping"><button type="button" class="sku-mapping-icon" title="Review SKU mapping" aria-label="Review SKU mapping" th:attr="data-provider='SHOPIFY',data-variant-id=${row.id},data-variant-revision=${row.revision},data-seller-sku=${row.sku},data-product-title=${row.title},data-image=${row.image},data-can-edit=${canSyncShopify}" onclick="NextAiMappingWidget.open(this)"><img th:attr="data-platform-icon=${row.mapped ? 'mapping' : 'unmapped'}" th:src="${row.mapped ? '/images/platform/table/sku-mapped.png' : '/images/platform/table/sku-not-mapped.png'}" alt=""></button><div class="sku-mapping-values">
          <span class="sku-identifier-line" th:each="part:${parts}" th:with="code=${part.vendorItemCode ?: part.accountSku}"><button type="button" class="sku-copy-value" th:attr="data-copy-value=${code},aria-label=${code == null ? 'Item code unavailable' : 'Item code '+code}" th:text="${(code ?: 'Item code unavailable')+' × '+#numbers.formatDecimal(part.quantity,1,0)}"></button><a th:href="@{/app/inventory/ledger(itemId=${part.itemId})}" th:attr="aria-label=${'Open inventory ledger for '+part.productName}" title="Open inventory ledger">↗</a></span>
          <button th:unless="${row.mapped}" type="button" class="mapping-warning-trigger" th:attr="data-provider='SHOPIFY',data-variant-id=${row.id},data-variant-revision=${row.revision},data-seller-sku=${row.sku},data-product-title=${row.title},data-image=${row.image},data-can-edit=${canSyncShopify}" onclick="NextAiMappingWidget.open(this)"><span class="mapping-unmapped-badge">Unmapped</span></button><small th:if="${row.mappingNeedsReview}" class="cell-note">Source changed · review mapping</small>
        </div></div>
        <div data-context-menu th:attr="data-title=${row.title}"><button type="button" data-action-description="Choose account products and quantities for this variant" th:attr="data-provider='SHOPIFY',data-variant-id=${row.id},data-variant-revision=${row.revision},data-seller-sku=${row.sku},data-product-title=${row.title},data-image=${row.image},data-can-edit=${canSyncShopify}" onclick="NextAiMappingWidget.open(this)">SKU mapping</button></div>
        <button class="collaboration-row-button" type="button" th:attr="data-entity-type='MARKETPLACE_SKU',data-entity-id=${row.subjectKey()},data-title=${row.title},data-identifier=${row.skuLabel()+' · '+row.gid},data-image=${row.image ?: ''},data-marketplace='Shopify',data-parent-url=${'/app/marketplace-skus?q='+row.gid},data-can-collaborate=${canSyncShopify},data-active-count=${conversation == null ? 0 : conversation.activeCount},data-total-count=${conversation == null ? 0 : conversation.totalCount},data-closed-count=${conversation == null ? 0 : conversation.closedCount}" onclick="openRecordCollaboration(this)" aria-label="Start or open collaboration"><svg viewBox="0 0 24 24"><path d="M5 5.5h14v9H9l-4 4v-13Z"/></svg><b th:if="${conversation != null and conversation.totalCount > 0}" th:text="${conversation.totalCount}"></b></button>
      </div></td>
      <td data-label="Product status" th:text="${row.productStatus}"></td><td data-label="Price"><strong th:text="${row.currency+' '+#numbers.formatDecimal(row.price,1,2)}"></strong></td><td data-label="Available"><span class="cell-note">Not imported</span></td><td data-label="4w sales"><strong th:if="${shopifyWeekly != null and shopifyWeekly.containsKey(row.id)}" class="weekly-sales" th:text="${shopifyWeekly.get(row.id)}" title="Current units on non-test, non-cancelled Shopify orders; rolling seven-day periods, oldest first"></strong><span th:unless="${shopifyWeekly != null and shopifyWeekly.containsKey(row.id)}" class="cell-note" th:text="${shopifyOrdersEnabled == true ? 'Awaiting order sync' : 'Not imported'}">Not imported</span></td><td data-label="Profit"><span class="cell-note">Not imported</span></td>
    </tr><tr th:if="${#lists.isEmpty(shopifyPage.rows)}"><td colspan="6"><div class="table-empty"><strong>No Shopify variants match this view</strong><span th:text="${shopifyJob != null and shopifyJob.running() ? 'Sync is still in progress. Imported observations appear as pages complete.' : 'Try another product status or search.'}"></span></div></td></tr>
  </tbody></table></div>
  <footer class="table-footer table-pagination sku-footer" th:attr="data-page=${shopifyPage.page},data-page-max=${shopifyPage.totalPages()},data-page-size=${shopifyPage.size}"><span th:text="${'Total: '+shopifyPage.total+' variants'}"></span><nav aria-label="Shopify variant pages"><a th:if="${shopifyPage.hasPrevious()}" th:href="@{/app/marketplace-skus(q=${query},status=${selectedStatus},sort=${selectedSort},direction=${sortDirection},page=${shopifyPage.page-1},size=${shopifyPage.size})}">Previous</a><span th:text="${'Page '+shopifyPage.displayPage()+' of '+shopifyPage.totalPages()}"></span><a th:if="${shopifyPage.hasNext()}" th:href="@{/app/marketplace-skus(q=${query},status=${selectedStatus},sort=${selectedSort},direction=${sortDirection},page=${shopifyPage.page+1},size=${shopifyPage.size})}">Next</a></nav></footer>
</section></body></html>
