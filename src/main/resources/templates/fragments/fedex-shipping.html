<!doctype html><html xmlns:th="http://www.thymeleaf.org"><body><th:block th:fragment="dialog">
<link rel="stylesheet" href="/css/fedex-shipping.css?v=ups-estimate-1"><script defer src="/js/shipping-label-print.js?v=2"></script><script defer src="/js/fedex-shipping.js?v=ups-estimate-1"></script>
<dialog id="fedex-shipping" aria-labelledby="fedex-title"><form class="dialog-shell" id="fedex-form">
<header class="dialog-header"><div><h2 id="fedex-title">Buy shipping</h2><p data-fedex-order></p></div><button type="button" class="dialog-close" data-fedex-close aria-label="Close shipping">×</button></header>
<div class="dialog-body"><p role="status" aria-live="polite" data-fedex-message hidden></p>
<section class="fedex-recipient" aria-label="Shipping recipient"><div class="fedex-recipient-row"><div data-recipient-summary></div><button type="button" class="fedex-text-button" data-recipient-edit aria-label="Edit address"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m16 3 5 5-12 12-6 1 1-6Z M13 6l5 5"/></svg>Edit</button></div>
<label class="fedex-check" data-sandbox-recipient hidden><input type="checkbox" name="testRecipient">Use a separate test recipient for sandbox shipping</label>
<div data-recipient-fields hidden><div class="fedex-fields"><label>Name<input name="name" required maxlength="100" autocomplete="off"></label><label>Phone<input name="phone" required type="tel" maxlength="20" autocomplete="off"></label><label class="fedex-wide">Street<input name="street" required maxlength="100" autocomplete="off"></label><label>Address line 2<input name="street2" maxlength="100" autocomplete="off"></label><label>Address line 3<input name="street3" maxlength="100" autocomplete="off"></label><label>City<input name="city" required maxlength="100" autocomplete="off"></label><label>State<input name="state" required maxlength="2" pattern="[A-Z]{2}" autocomplete="off"></label><label>ZIP code<input name="postalCode" required pattern="[0-9]{5}(-[0-9]{4})?" autocomplete="off"></label><label>Country<input name="country" required maxlength="2" autocomplete="off"></label></div><label class="fedex-check"><input name="residential" type="checkbox">Residential address</label><div class="fedex-inline-actions"><button type="button" class="secondary-button" data-recipient-cancel>Cancel</button><button type="button" class="primary-button" data-recipient-save>Save address</button></div></div></section>
<div class="fedex-fields fedex-routing"><label data-carrier-connection>Carrier account<select data-standard-choice aria-label="Carrier account" name="carrierId" required></select></label><label>Ship from<select data-standard-choice aria-label="Ship from" name="senderId" required></select></label></div>
<section class="fedex-carriers" aria-label="Carrier filter"><button type="button" data-carrier-filter="ALL" aria-pressed="true">All</button><button type="button" data-carrier-filter="FEDEX" aria-pressed="false"><img src="/images/channels/fedex-official.png" alt="FedEx"></button><button type="button" data-carrier-filter="UPS" aria-pressed="false"><img src="/images/channels/ups-official.svg" alt="UPS"></button><button type="button" data-carrier-filter="USPS" aria-pressed="false"><img src="/images/channels/usps-official.svg" alt="USPS"></button></section>
<section class="fedex-parcel" aria-label="Package"><div class="fedex-parcel-row"><label>Packaging<select data-standard-choice aria-label="Packaging" name="packagingId" required></select></label><label>Weight (lb)<input name="weight" type="number" min="0.01" max="150" step="any" required></label></div><div class="fedex-measurements" data-custom-dimensions><label>Length (in)<input name="length" type="number" min="0.01" max="150" step="any" required></label><label>Width (in)<input name="width" type="number" min="0.01" max="150" step="any" required></label><label>Height (in)<input name="height" type="number" min="0.01" max="150" step="any" required></label></div></section>
<section data-fedex-rates aria-label="Shipping rates"></section><section data-fedex-history aria-label="Shipping label"></section>
</div><footer class="dialog-actions" hidden></footer></form></dialog>
<dialog id="fedex-sender" aria-labelledby="fedex-sender-title"><form id="fedex-sender-form" class="dialog-shell"><header class="dialog-header"><h2 id="fedex-sender-title">Add ship-from address</h2><button type="button" class="dialog-close" data-sender-close aria-label="Close address">×</button></header><div class="dialog-body"><p role="status" data-sender-error hidden></p><th:block th:replace="~{fragments/ship-from-address :: fields}"></th:block></div><footer class="dialog-actions"><button type="button" class="secondary-button" data-sender-close>Cancel</button><button type="submit" class="primary-button">Save address</button></footer></form></dialog>
</th:block></body></html>
