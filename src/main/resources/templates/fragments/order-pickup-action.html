<!doctype html><html xmlns:th="http://www.thymeleaf.org"><body><th:block th:fragment="pickup(orderKey,marked,allowed)"><form class="platform-pickup-action" th:if="${allowed}" method="post" th:action="@{/app/orders/{id}/pickup-override(id=${orderKey})}" th:attr="data-confirm-title=${marked?'Undo packing?':'Mark as shipped?'},data-confirm-message=${marked?'The packed items will be returned to shelf stock. This changes your platform records only, not the marketplace.':'The packed items will leave shelf stock and move to waiting for pickup. This changes your platform records only, not the marketplace.'},data-confirm-accept=${marked?'Undo packing':'Mark as shipped'}">
<input type="hidden" name="waiting" th:value="${!marked}"><input type="hidden" name="status" th:value="${selectedStatus}">
<button type="submit" class="order-icon-action" th:title="${marked?'Undo platform pickup mark':'Mark as shipped'}" th:attr="aria-label=${marked?'Undo platform pickup mark':'Mark as shipped'}"><span class="action-icon" aria-hidden="true"><svg th:unless="${marked}" viewBox="0 0 24 24"><path d="M9 4H5v17h14V4h-4M9 2h6v5H9zM8 14l3 3 5-6"/></svg><svg th:if="${marked}" viewBox="0 0 24 24"><path d="m8 4-5 5 5 5M3 9h10a6 6 0 0 1 0 12"/></svg></span></button>
</form></th:block></body></html>
