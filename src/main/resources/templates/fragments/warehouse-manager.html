<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"><body>
<dialog id="warehouse-dialog" th:fragment="manager(warehouses)" class="invite-dialog location-manager-dialog" aria-labelledby="warehouse-heading"><form class="dialog-shell" method="post" th:action="@{/app/catalog/warehouse-options}" onsubmit="return saveManagedWarehouse(event,this)"><div class="dialog-header"><div><span class="eyebrow dark">Inventory</span><h2 id="warehouse-heading">Warehouses</h2></div><button type="button" class="dialog-close" aria-label="Close warehouses" onclick="this.closest('dialog').close()">×</button></div><div class="dialog-body catalog-form"><section class="location-directory"><header><div><strong>Existing warehouses</strong><span class="location-directory-count" id="warehouse-count"></span></div></header><div class="location-directory-list" id="warehouse-directory"><article th:each="warehouse:${warehouses}" th:attr="data-warehouse-id=${warehouse.id}"><div><strong th:text="${warehouse.name}">Default Warehouse</strong><small th:text="${#strings.isEmpty(warehouse.addressSummary) ? 'Address not entered' : warehouse.addressSummary}"></small></div><b class="location-status" th:if="${warehouse.isDefault}">Default</b><div class="location-actions"><button type="button" th:attr="data-edit-warehouse=${warehouse.id}">Edit</button></div></article></div><p class="notice error" id="warehouse-list-error" hidden>Warehouses could not be loaded. <button type="button" class="secondary-button compact-button" onclick="loadWarehouseDirectory()">Retry</button></p></section><section class="location-create-panel"><input type="hidden" name="id" disabled><h3 id="warehouse-form-heading">Add warehouse</h3><label>Warehouse nickname<input name="name" maxlength="160" required placeholder="Default Warehouse"></label><label>Address line 1<input name="addressLine1" maxlength="240" autocomplete="address-line1"></label><label>Address line 2<input name="addressLine2" maxlength="240" autocomplete="address-line2"></label><div class="form-pair"><label>City<input name="city" maxlength="120" autocomplete="address-level2"></label><label>State / province<input name="stateOrProvince" maxlength="80" autocomplete="address-level1"></label></div><div class="form-pair"><label>Postal code<input name="postalCode" maxlength="32" autocomplete="postal-code"></label><label>Country code<input name="countryCode" maxlength="2" pattern="[A-Za-z]{2}" placeholder="US" autocomplete="country"></label></div><div class="location-create-section"><div class="location-editor-heading"><strong>Contacts</strong><button type="button" class="secondary-button compact-button" onclick="addWarehouseContact()">＋ Add contact</button></div><div id="warehouse-contacts"></div></div><p class="notice" data-warehouse-feedback role="status" hidden></p></section></div><div class="dialog-actions"><button type="button" class="secondary-button" id="warehouse-cancel-edit" hidden onclick="resetWarehouseForm()">Cancel editing</button><button type="button" class="secondary-button" onclick="this.closest('dialog').close()">Done</button><button type="submit" class="primary-button compact-button" id="warehouse-save">Add warehouse</button></div></form></dialog>
</body></html>
