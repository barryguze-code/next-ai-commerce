<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><body>
<dialog id="warehouse-dialog" th:fragment="manager(warehouses)" class="invite-dialog location-manager-dialog" aria-labelledby="warehouse-heading">
 <form class="dialog-shell" method="post" th:action="@{/app/catalog/warehouse-options}" onsubmit="return saveManagedWarehouse(event,this)">
  <div class="dialog-header"><div><span class="eyebrow dark">Inventory</span><h2 id="warehouse-heading">Add warehouse</h2></div><button type="button" class="dialog-close" aria-label="Close warehouses" onclick="closeWarehouseEditor()">×</button></div>
  <div class="dialog-body catalog-form">
   <section class="location-directory" hidden><header><div><strong>Existing warehouses</strong><span class="location-directory-count" id="warehouse-count"></span></div></header><div class="location-directory-list" id="warehouse-directory"><article th:each="warehouse:${warehouses}" th:attr="data-warehouse-id=${warehouse.id}"><div><strong th:text="${warehouse.name}">Default Warehouse</strong><small th:text="${warehouse.addressSummary}"></small></div><div class="location-actions"><button type="button" th:attr="data-edit-warehouse=${warehouse.id}">Edit</button></div></article></div><p class="notice error" id="warehouse-list-error" hidden>Warehouses could not be loaded. <button type="button" class="secondary-button compact-button" onclick="loadWarehouseDirectory()">Retry</button></p></section>
   <section class="location-create-panel">
    <input type="hidden" name="warehouseAccount" th:value="${session.selectedTenantId}"><input type="hidden" name="id" disabled><h3 id="warehouse-form-heading" hidden>Add warehouse</h3>
    <label>Warehouse nickname<input name="name" maxlength="160" required placeholder="Default Warehouse"></label>
    <section class="warehouse-contact-section" aria-labelledby="warehouse-contact-heading"><div class="warehouse-contact-heading"><strong id="warehouse-contact-heading">Contacts</strong><button type="button" class="secondary-button compact-button" onclick="addWarehouseContact()">＋ Add contact</button></div><div id="warehouse-contacts"></div></section>
    <fieldset id="warehouse-address" aria-describedby="warehouse-save-reason" disabled><legend class="sr-only">Warehouse address</legend>
     <label>Address line 1<input name="addressLine1" maxlength="240" autocomplete="address-line1"></label><label>Address line 2<input name="addressLine2" maxlength="240" autocomplete="address-line2"></label>
     <div class="form-pair"><label>City<input name="city" maxlength="120" autocomplete="address-level2"></label><label>State / province<input name="stateOrProvince" maxlength="80" autocomplete="address-level1"></label></div>
     <div class="form-pair"><label>Postal code<input name="postalCode" required maxlength="32" autocomplete="postal-code"></label><label>Country code<input name="countryCode" required maxlength="2" pattern="[A-Za-z]{2}" placeholder="Country code" autocomplete="country"></label></div>
    </fieldset>
   </section>
  </div>
  <div class="dialog-actions"><p class="notice" data-warehouse-feedback role="status" aria-live="polite" hidden></p><div class="warehouse-footer-buttons"><button type="button" class="secondary-button" onclick="closeWarehouseEditor()">Cancel</button><span class="warehouse-save-control" tabindex="0" data-tooltip="Enter a contact" aria-describedby="warehouse-save-reason"><button type="submit" class="primary-button compact-button" id="warehouse-save" disabled aria-describedby="warehouse-save-reason">Add warehouse</button></span><span class="sr-only" id="warehouse-save-reason">Enter a contact</span></div></div>
 </form>
</dialog>
</body></html>
