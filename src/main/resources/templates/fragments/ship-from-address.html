<!doctype html><html xmlns:th="http://www.thymeleaf.org"><body><th:block th:fragment="fields"><div class="shipping-form-grid"><label><span>Address name</span><input name="label" placeholder="Main warehouse" required></label><label><span>Contact name</span><input name="contactName" required></label><label class="wide"><span>Company</span><input name="companyName"></label><label class="wide"><span>Street address</span><input name="line1" required></label><label class="wide"><span>Address line 2</span><input name="line2"></label><label><span>City</span><input name="city" required></label><label><span>State / province</span><input name="state" required></label><label><span>Postal code</span><input name="postalCode" required></label><label><span>Country</span><input name="countryCode" value="US" maxlength="2" required></label><label><span>Phone</span><input name="phone" type="tel" required></label><label><span>Email</span><input name="email" type="email"></label></div><label class="shipping-check"><input name="isDefault" type="checkbox" checked><span><strong>Use as the default ship-from address</strong><small>It will be selected automatically for future labels.</small></span></label></th:block></body></html>
