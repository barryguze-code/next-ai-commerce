<!doctype html><html xmlns:th="http://www.thymeleaf.org"><body><th:block th:fragment="tabs(tabs,pageSize)"><a th:each="tab : ${tabs}" th:if="${tab.key=='ALL' or tab.orders == null or tab.orders > 0}" th:classappend="${(selectedStatus==tab.key?'active ':'')+((tab.readiness or tab.key=='NEEDS_MAPPING' or tab.key=='BUY_BOX_LOST')?'order-alert-tab ':'')+((tab.readiness or tab.key=='NEEDS_MAPPING' or tab.key=='BUY_BOX_LOST') and tab.orders>0?'has-issues ':'')+(tab.key=='INVENTORY_SHORTAGE'?'alert-group-start':'')+(tab.key=='UNSHIPPED'?' order-informative-tab':'')}" th:href="@{/app/orders(status=${tab.key},q=${query},size=${pageSize})}" th:attr="aria-current=${selectedStatus==tab.key?'page':null},aria-label=${tab.label+': '+tab.orders+' orders, '+tab.units+' units'},title=${tab.orders+' orders / '+tab.units+' units'}"><span th:text="${tab.label}">Unshipped</span><span class="order-tab-count"><b th:text="${#numbers.formatInteger(tab.orders,1,'COMMA')}">0</b><i aria-hidden="true">/</i><span th:text="${#numbers.formatInteger(tab.units,1,'COMMA')}">0</span></span></a></th:block></body></html>
