# A local profile NEVER inherits the remote DB_URL from an Eclipse or production launch.
spring:
  config:
    import: optional:file:./.local/app.properties
  datasource:
    url: jdbc:postgresql://127.0.0.1:55432/next_ai_commerce_local
    username: nextcommerce_local
    password: ${LOCAL_DB_PASSWORD:}
  thymeleaf:
    cache: true
server:
  address: 127.0.0.1
app:
  # The local UAT badge deliberately identifies the active feature build.  The
  # production default remains the APP_BUILD_VERSION value from application.yml.
  build-version: 1.0.1-local-uat
  public-url: http://localhost:8080
  scheduling:
    enabled: true
  integrations:
    external-enabled: true
  amazon:
    sync-enabled: true
    write-enabled: false
    # Local UAT continuously imports Amazon data, but write-enabled remains false.
    recurring-enabled: true
    startup-order-reconciliation-enabled: false
    listing-actions-enabled: false
  local-packing-history:
    path: ${LOCAL_PACKING_HISTORY_FILE:}
  mail:
    enabled: false
    provider: disabled
