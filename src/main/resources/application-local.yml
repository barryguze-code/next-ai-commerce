# Local UAT uses the existing loopback database; no production datasource inheritance.
spring:
  config:
    import: optional:file:./.local/app.properties
  datasource:
    url: jdbc:postgresql://127.0.0.1:55432/next_ai_commerce_local
    username: nextcommerce_local
    password: ${LOCAL_DB_PASSWORD:}
  thymeleaf:
    cache: false
server:
  address: 127.0.0.1
app:
  local-development: true
  local:
    manual-sync-only: true
  build-branch: local
  public-url: http://localhost:8080
  scheduling:
    enabled: false
  integrations:
    external-enabled: true
  amazon:
    sync-enabled: true
    recurring-enabled: false
    startup-order-reconciliation-enabled: false
    local-read-only-scheduling: false
    recipient-import-enabled: false
    write-enabled: false
    listing-actions-enabled: false
    shelf-sale-enabled: false
    inventory-publication-enabled: false
    inventory-publication-mode: DRY_RUN
    buy-shipping-enabled: false
    fee-pilot:
      only-scheduling: false
    variation:
      trial-only-scheduling: false
  shopify:
    orders:
      only-scheduling: false
      polling-enabled: false
    inventory:
      write-enabled: false
    prices:
      write-enabled: false
    sale-prices:
      write-enabled: false
  fba:
    shipment-write-enabled: false
    charge-write-enabled: false
    depletion:
      automatic-enabled: false
  fedex:
    confirmation-enabled: false
  local-packing-history:
    path: ${LOCAL_PACKING_HISTORY_FILE:}
  mail:
    enabled: false
    provider: disabled
