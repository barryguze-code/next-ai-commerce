name: CI
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn --batch-mode verify
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Preserve tested notice hotfix artifact
        if: github.ref == 'refs/heads/codex/notice-only-hotfix'
        uses: actions/upload-artifact@v4
        with:
          name: notice-hotfix-package
          path: target/next-ai-commerce-1.6.10.jar
          if-no-files-found: error
      - name: Preserve tested minor release artifact
        if: github.ref == 'refs/heads/codex/minor-1-7-release'
        uses: actions/upload-artifact@v4
        with:
          name: minor-1-7-package
          path: target/next-ai-commerce-1.7.2.jar
          if-no-files-found: error
      - name: Preserve tested tooltip hotfix artifact
        if: github.ref == 'refs/heads/codex/tooltip-resize-hotfix-1-7-3'
        uses: actions/upload-artifact@v4
        with:
          name: tooltip-hotfix-package
          path: target/next-ai-commerce-1.7.3.jar
          if-no-files-found: error
