name: Catalogue removal hotfix
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn --batch-mode -Dtest=CatalogRemovalDatabaseTest,CatalogRemovalAccessTest test
      - run: mvn --batch-mode -Dmaven.test.skip=true package
      - uses: actions/upload-artifact@v4
        with:
          name: catalogue-removal-1.14.14-package
          path: target/next-ai-commerce-1.14.14.jar
          if-no-files-found: error
