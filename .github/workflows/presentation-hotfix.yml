name: Focused hotfix
on:
  workflow_dispatch:
    inputs:
      classification:
        description: 'Owner-approved focused scope: presentation, client read-only access UI, or receiving document parsing; no schema or integration writes'
        required: true
        type: choice
        options: [PRESENTATION_ONLY, CLIENT_READ_ONLY_ACCESS_UI, RECEIVING_DOCUMENT_IMPORT, HUDDLE_SELECTION, HUDDLE_FINALIZATION]
      focused_test:
        description: 'Focused non-browser Node regression test filename under src/test/js'
        required: true
        default: inventory-reservations.test.cjs
      java_test:
        description: 'Focused Java test class if Java behavior changed; leave empty for presentation projection only'
        required: false
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Validate explicit hotfix classification and test selection
        env:
          CLASSIFICATION: ${{ inputs.classification }}
          NODE_TEST: ${{ inputs.focused_test }}
          JAVA_TEST: ${{ inputs.java_test }}
        run: |
          [[ "$CLASSIFICATION" = PRESENTATION_ONLY || "$CLASSIFICATION" = CLIENT_READ_ONLY_ACCESS_UI || "$CLASSIFICATION" = RECEIVING_DOCUMENT_IMPORT || "$CLASSIFICATION" = HUDDLE_SELECTION || "$CLASSIFICATION" = HUDDLE_FINALIZATION ]]
          [[ "$NODE_TEST" =~ ^[a-zA-Z0-9_-]+\.test\.cjs$ ]]
          test -f "src/test/js/$NODE_TEST"
          [[ -z "$JAVA_TEST" || "$JAVA_TEST" =~ ^[a-zA-Z0-9_.]+Test$ ]]
      - name: Install unit test dependencies
        run: npm ci --ignore-scripts
      - name: Focused unit regressions
        if: inputs.classification == 'PRESENTATION_ONLY'
        env:
          NODE_TEST: ${{ inputs.focused_test }}
          JAVA_TEST: ${{ inputs.java_test }}
        run: |
          node --test "src/test/js/$NODE_TEST"
          if [[ -n "$JAVA_TEST" ]]; then mvn --batch-mode -Dtest="$JAVA_TEST" test; fi
      - name: Focused client access and chat regressions
        if: inputs.classification == 'CLIENT_READ_ONLY_ACCESS_UI'
        run: |
          mvn --batch-mode -Dtest=InvitationExistingAccessTest,InvitationServiceTest,HuddleWebSocketHandlerTest,HuddleServiceTest,TemplateRenderingTest,CollaborationBoardTemplateTest test
          npx playwright install --with-deps chromium
          node --test src/test/js/collaboration-invite-hotfix.test.cjs src/test/js/huddle-floating.test.cjs src/test/js/huddle-picker.test.cjs src/test/js/collaboration-uat.test.cjs src/test/js/personal-collaboration-drag.test.cjs src/test/js/collaboration-navigation-composer.test.cjs
      - name: Focused receiving import regressions
        if: inputs.classification == 'RECEIVING_DOCUMENT_IMPORT'
        run: |
          mvn --batch-mode '-Dtest=ReceivingCatalogIdentityTest,ReceivingInvoiceParserTest,ReceivingControllerTest,ReceivingWorkflowControllerTest,ReceivingWorkflowDatabaseTest#keheNumericTextBarcodePreservesSourceAndCreatesDraftWithoutStock' test
          npx playwright install --with-deps chromium
          node --test src/test/js/receiving-upload.test.cjs
      - name: Focused collaboration selection regressions
        if: inputs.classification == 'HUDDLE_SELECTION'
        run: |
          mvn --batch-mode -Dtest=HuddleServiceTest,HuddleWebSocketHandlerTest test
          npx playwright install --with-deps chromium
          node --test src/test/js/huddle-floating.test.cjs src/test/js/huddle-picker.test.cjs
          node --test --test-name-pattern='picker selects two teammates' src/test/js/collaboration-invite-hotfix.test.cjs
      - name: Focused collaboration finalization regressions
        if: inputs.classification == 'HUDDLE_FINALIZATION'
        run: |
          mvn --batch-mode '-Dtest=HuddleServiceTest,HuddleWebSocketHandlerTest,CollaborationQueueDatabaseTest#durableChatRestoresAndConvertsMessagesFilesAndAudienceOnce' test
          npx playwright install --with-deps chromium
          node --test src/test/js/huddle-finalize.test.cjs src/test/js/huddle-floating.test.cjs src/test/js/huddle-picker.test.cjs
      - name: Build exact hotfix package
        run: |
          mvn --batch-mode -DskipTests package
          sha256sum target/next-ai-commerce-*.jar > target/hotfix.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: presentation-hotfix-${{ github.sha }}
          path: |
            target/next-ai-commerce-*.jar
            target/hotfix.sha256
          retention-days: 14
# Presentation mode retains its existing focused non-browser gate.
# Client read-only lookup/UI mode is explicitly owner-selected; grant-policy, schema, inventory
# and integration-write changes remain excluded. Normal feature/release CI is unchanged.
