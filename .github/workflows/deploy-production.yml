name: Deploy production

on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Successful normal CI run containing the verified release artifact
        required: true
        type: string
      revision:
        description: Exact validated 40-character source revision
        required: true
        type: string
      package_sha256:
        description: Exact verified CI JAR SHA-256
        required: true
        type: string
      release_plan:
        description: Reviewed application-only baseline and compatible recovery JSON (no credentials)
        required: true
        type: string

concurrency:
  group: next-ai-commerce-production
  cancel-in-progress: false

permissions:
  contents: write
  actions: read
  id-token: write

jobs:
  deploy:
    # Preserve the existing environment-approved release route. Execute only the
    # immutable reviewed default-branch tools, never candidate application scripts.
    if: github.ref_name == 'release/v1.0.0'
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d67deef255a5679ddb9d495300426bbaeffb7cf3
          persist-credentials: false
      - name: Verify and publish the exact successful CI artifact (no rebuild or retest)
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.source_run }}
          PROMOTION_REVISION: ${{ inputs.revision }}
          PACKAGE_SHA256: ${{ inputs.package_sha256 }}
          RELEASE_PLAN: ${{ inputs.release_plan }}
          REVIEWED_PLAN_SHA256: ${{ vars.PRODUCTION_MANIFEST_SHA256 }}
        run: python3 scripts/ci/promote.py
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::038462776212:role/NextAICommerceGitHubDeployRole
          aws-region: us-west-1
      - name: Application-only installation using existing guarded SSM target
        env:
          INSTANCE_ID: i-043ea7df8377dd0a9
        run: |
          command_id=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript --parameters file://.promotion-command.json --query Command.CommandId --output text)
          status=Pending
          for attempt in $(seq 1 80); do
            status=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Success|Failed|Cancelled|TimedOut) break;; esac
            sleep 15
          done
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query '{status:Status,summary:StandardOutputContent,error:StandardErrorContent}' --output json
          test "$status" = Success
