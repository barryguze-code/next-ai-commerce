name: Deploy production

on:
  push:
    branches: ["release/v1.0.0"]
  workflow_dispatch:

concurrency:
  group: next-ai-commerce-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn --batch-mode verify
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::038462776212:role/NextAICommerceGitHubDeployRole
          aws-region: us-west-1
      - env:
          INSTANCE_ID: i-043ea7df8377dd0a9
          REVISION: ${{ github.sha }}
        run: |
          encoded=$(base64 -w0 scripts/production-release.sh)
          parameters=$(jq -n --arg command "printf '%s' '$encoded' | base64 -d | bash -s -- '$REVISION' '1.0.1'" '{commands:[$command],executionTimeout:["1800"]}')
          command_id=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript --parameters "$parameters" --query 'Command.CommandId' --output text)
          for attempt in $(seq 1 120); do
            status=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Success|Failed|Cancelled|TimedOut) break;; esac
            sleep 15
          done
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query '{status:Status,summary:StandardOutputContent,error:StandardErrorContent}' --output json
          test "$status" = Success
