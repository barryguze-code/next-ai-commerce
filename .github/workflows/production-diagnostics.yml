name: Production startup diagnostics
on:
  push:
    branches: ["development/post-v1.3.0"]
    paths: [".github/workflows/production-diagnostics.yml"]
permissions:
  contents: read
  id-token: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::038462776212:role/NextAICommerceGitHubDeployRole
          aws-region: us-west-1
      - name: Read startup health
        run: |
          command="systemctl show next-ai-commerce -p ActiveState -p SubState -p Result -p ExecMainStatus; readlink /opt/next-ai-commerce/next-ai-commerce.jar; df -h /opt/next-ai-commerce; journalctl -u next-ai-commerce --since '20 minutes ago' --no-pager | grep -E 'Started .*Application|Starting .*Application|APPLICATION FAILED|Caused by:|Migrating schema|Successfully applied|Migration .*failed|OutOfMemory|BeanCreationException|ERROR.*Flyway|ERROR.*SpringApplication' | tail -60; curl -s -o /dev/null -w 'Local login HTTP %{http_code}' --max-time 5 http://127.0.0.1:8080/login"
          parameters=$(jq -n --arg command "$command" '{commands:[$command],executionTimeout:["60"]}')
          command_id=$(aws ssm send-command --instance-ids i-043ea7df8377dd0a9 --document-name AWS-RunShellScript --parameters "$parameters" --query 'Command.CommandId' --output text)
          aws ssm wait command-executed --command-id "$command_id" --instance-id i-043ea7df8377dd0a9 || true
          aws ssm get-command-invocation --command-id "$command_id" --instance-id i-043ea7df8377dd0a9 --query '{status:Status,summary:StandardOutputContent,error:StandardErrorContent}' --output json
