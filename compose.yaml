services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: next_ai_commerce
      POSTGRES_USER: nextcommerce
      POSTGRES_PASSWORD: local-only-password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextcommerce"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - next_ai_commerce_postgres:/var/lib/postgresql/data
volumes:
  next_ai_commerce_postgres:
